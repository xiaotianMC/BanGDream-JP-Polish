# ⚠️ 示范记录 —— 数据来自交接文档 §19 的示例，不是真实修订数据。
#
# 它的作用是演示 _schema.md 的格式，并把「AI 原文 → 人工修订 → 为什么」
# 这条链路跑通一次。**不要**把它当作已校准的证据。
#
# 真实的第一条记录应该是你手上真实的 AI 翻译 + 人工改版。

id: kasumi-2026-02-14-live-invite
date: 2026-02-14
character: 戸山香澄
scene: ライブ後の会話、メンバーを次回に誘う
emotion: 興奮 / 感謝
source: 文档示例            # 非真实数据，见文件头
tts_engine: null            # 引擎未定。不猜（Global G8）

pairs:
  - original: |
      今日は本当にすごく楽しかったです！
      次も一緒にライブをやりましょう！
    corrected: |
      今日はほんっとに楽しかったー！
      次も一緒にライブやろうよ！
    chinese: |
      今天真的超级开心！下次也一起演出吧！
    changes:
      - from: 本当に
        to: ほんっとに
        issues: [character_style, emotion]
        reason: |
          兴奋状态下的强调形。插入促音会带出气势。
          陈述性场面保持「本当に」即可（边界参见 excludes）
      - from: すごく
        to: （削除）
        issues: [natural_japanese]
        reason: |
          由「ほんっとに」承担强度，因此成了程度副词的重复。
          在日语中，程度副词的双重修饰听起来冗长
      - from: 楽しかったです
        to: 楽しかったー
        issues: [character_style, sentence_ending, tts]
        reason: |
          朋友之间、且处于兴奋状态时，敬体不自然（会产生距离感）。
          长音「ー」从语音上辅助表现兴奋
      - from: やりましょう
        to: やろうよ
        issues: [character_style, sentence_ending]
        reason: |
          敬体的劝诱「〜ましょう」过于礼貌。
          香澄对地位对等的对象会用直接邀请的形式
      - from: ライブをやろうよ
        to: ライブやろうよ
        issues: [natural_japanese]
        reason: 口语中省略助词「を」

generalizable_rule: |
  对兴奋状态下的香澄不使用です・ます。劝诱用「〜しよう」「〜やろうよ」。
  不过在正式场合、对长辈的场合敬体才是正确的（去掉这个边界就会过拟合）

promoted_rule_ids: [kasumi_001, kasumi_002, kasumi_003, global_001, global_002]

not_promoted:
  - change: すごく → （削除）
    why: 为该语境特有。需要「すごく」的句子很多，无法成为一般规律
  - change: 「キラキラ」「みんな」の追加
    why: |
      添加原文中不存在的信息（违反 Global G2）。
      虽是香澄的特征词，但加到所有台词里属于刻板模仿，是角色规则的过拟合

confidence: observed
evidence_count: 1
note: |
  由于 evidence_count 为 1，promoted_rule_ids 中的各条规则全部按 observed 处理。
  同种修正从不同场景收集到 3 件以上时，再考虑升格为 recommended。
  「です・ます を使わない」一旦去掉边界（正式场合）就容易误用，所以
  升格时必须保留 excludes。
