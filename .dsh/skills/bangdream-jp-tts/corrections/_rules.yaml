# 已提炼规则 — 机器可读
#
# 这个文件由 Learn 流程写入。SKILL.md 读取它以应用高置信度规则。
# 格式与升级标准见 _schema.md §5。
#
# ⚠️ 当前所有条目的 status 都是 demo，来自文档 §19 的示范案例，
#    不是从真实人工修订数据中提炼的。**不得作为强制修改依据。**
#    真实数据灌入后，应删除 demo 条目并重新提炼。

version: 0
updated: 2026-02-14

# ─────────────────────────────────────────────────────────────
# 字段说明
# ─────────────────────────────────────────────────────────────
#
# id            规则唯一 id，<character>_<nnn>
# rule          一句话规则。写不成一句话 = 不该升级
# layer         global | japanese | character | tts
# applies_to    适用角色。跨角色规则写 [*]
# scope         生效范围
# excludes      边界——什么情况不适用。**必填**，无边界必过拟合
# confidence    observed(1-2) | recommended(3-9) | established(10+)
# evidence_count 支撑样本数
# evidence      来源 correction 文件 id 列表
# created       建立日期
# status        active | demo | retracted
# retracted_reason / retracted_date  仅 retracted 时填
#
# ─────────────────────────────────────────────────────────────

rules:

  - id: kasumi_001
    rule: 兴奋状态下不使用です・ます
    layer: character
    applies_to: [戸山香澄]
    scope: 兴奋・与亲近对象的对话
    excludes: 官方场合、长辈、初次见面
    confidence: observed
    evidence_count: 1
    evidence: [kasumi-2026-02-14-live-invite]
    created: 2026-02-14
    status: demo

  - id: kasumi_002
    rule: 不使用敬体劝诱「〜ましょう」。使用「〜しよう」「〜やろうよ」
    layer: character
    applies_to: [戸山香澄]
    scope: 邀请亲近对象的场面
    excludes: 邀请长辈・初次见面对象的场面（敬体才正确）
    confidence: observed
    evidence_count: 1
    evidence: [kasumi-2026-02-14-live-invite]
    created: 2026-02-14
    status: demo

  - id: kasumi_003
    rule: 兴奋的强调不用「本当に」，而用「ほんっとに」（插入促音）
    layer: character
    applies_to: [戸山香澄]
    scope: 情绪高涨的场面
    excludes: 平叙・冷静说明的场面（保持「本当に」即可）
    confidence: observed
    evidence_count: 1
    evidence: [kasumi-2026-02-14-live-invite]
    created: 2026-02-14
    status: demo

  - id: global_001
    rule: 口语中可以省略助词「を」（ライブをやろう → ライブやろう）
    layer: japanese
    applies_to: ['*']
    scope: 口语的会话句
    excludes: 书面语、以及会导致语义暧昧的情况
    confidence: observed
    evidence_count: 1
    evidence: [kasumi-2026-02-14-live-invite]
    created: 2026-02-14
    status: demo

  - id: global_002
    rule: 不重复使用程度副词（本当にすごく楽しかった → ほんっとに楽しかった）
    layer: japanese
    applies_to: ['*']
    scope: 对同一程度进行双重修饰的情况
    excludes: 有意的强调叠加（如「すごくすごく嬉しい」）
    confidence: observed
    evidence_count: 1
    evidence: [kasumi-2026-02-14-live-invite]
    created: 2026-02-14
    status: demo

