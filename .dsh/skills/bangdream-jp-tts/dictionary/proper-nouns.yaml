      `*` は GPT-SoVITS で予期しない挙動を起こしうる記号（adapters/gpt-sovits.md）

  - canonical: モルフォニカ
    latin: Morfonica
    members: [倉田ましろ, 桐谷透子, 広町七深, 二葉つくし, 八潮瑠唯]

  - canonical: レイズアスイレン
