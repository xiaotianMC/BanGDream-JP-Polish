# ─────────────────────────────────────────────────────────────
# 中文译名（Gate B）—— **派生ビュー。ここには保存しない**
# ─────────────────────────────────────────────────────────────
# 中文名の正体は **characters セクション**（各角色の zh / zh_alt / zh_community）。
# zh_variants は validator が characters から導出して検査する。
# ファイルに保存しない理由：同じ値を 2 箇所に持つと、片方だけ直して必ず食い違う。
# （実際に一度そうなり、validator で一致を強制する羽目になった）
#
#   characters[].zh            中文名（= 旧 zh_variants の official）
#   characters[].zh_alt        出典に併記された別訳（あれば）
#   characters[].zh_community  出典が「早期译名」等として明示した表記（あれば）
#
# 規則：
#   - 选定后即为该批次的 canonical，**同一批次内不得混用**（G7 の精神）
#   - これが決めるのは「どの表記を使うか」だけ。「変えるべきか」は決めない
#   - 日本語正文の表記は characters の canonical が正（例：日本語は常に「そよ」）
#   - 出典に無い表記を**推測で足さない**（G8）
#
# 補完済みは**ポッピンパーティとマイゴの 2 バンドのみ**（ユーザー指定）。
# 他バンドは未補完——必要になったら出典で確認してから characters に追加する。

