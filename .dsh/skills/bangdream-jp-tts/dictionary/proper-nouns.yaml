unregistered:

  - item: 上記以外の全キャラクター
    action: 使用前に公式表記を確認し、この表に追加する

  - item: 楽曲名
    action: |
      曲名は本表に未登録。台詞に曲名が出た場合：
        1. 公式表記を確認する
        2. 表記が曖昧な場合は【待確認】に出す
        3. 確認できたら songs セクションを新設して登録する

  - item: 声優名・スタッフ名
    action: 本 Skill の対象外。地の文に出た場合は【待確認】
