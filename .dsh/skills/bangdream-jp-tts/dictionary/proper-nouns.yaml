# ─────────────────────────────────────────────────────────────
# 称呼对应表 —— 已拆分到独立文件
# ─────────────────────────────────────────────────────────────
# 称呼数据现在维护在 dictionary/address-forms.yaml。
# **该文件是称呼的唯一事实来源**——本文件不再保存称呼表。
#
# 拆分理由：称呼是跨角色数据，且体积增长快（燈一人就有 70+ 条），
# 与「读音」「专有名词表記」的维护节奏也不同。
#
# 相关规则：
#   G6  人物关系一致性     —— 称呼必须稳定，关系变化要跟随
#   characters/mygo/tomori.md          —— 燈的称呼使用口径（含时间轴说明）
#   characters/poppin-party/kasumi.md  —— 香澄的称呼使用口径
#
# 下表原来的内容已全部移入 address-forms.yaml，未丢失。
# ─────────────────────────────────────────────────────────────
# 中文译名变体对照（Gate 2 用）
# ─────────────────────────────────────────────────────────────
# 用途：用户选择「贴近官方」或「更社区化」时，据此决定中文正文用哪种写法。
#
# 规则：
#   - 选定后即为该批次的 canonical，**同一批次内不得混用**（G7 的精神）
#   - 这只决定「用哪个变体」，不决定「该不该改」
#   - 本表**只管中文输出**。日语正文的表记以 characters/ 段的 canonical 为准
#     （例如日语写「そよ」，中文写「爽世」或「素世」）
#   - 表里没有的译名分歧**不要猜**（G8），列入【待确认】并建议补入本表
#
# official = 官方中文译名 / community = 社区通用译名
# official  = 出典（萌娘百科の各項目）に記載された中文名
# community = それ以外に流布している表記。**出典に「早期译名」等の記載がある場合のみ記録**
#
# ⚠ 確認済みは**ポッピンパーティとマイゴの 2 バンドのみ**（ユーザー指定）。
#   他バンドは未補完。台本で必要になったら、そのキャラの項目で確認してから追加する。
#
# 構造：
#   japanese  日本語 canonical（characters/ 段と一致させる）
#   official  出典記載の中文名（= 日本語の zh フィールドと同値）
#   alt       出典に併記された別訳（あれば）
#   community 出典が「早期译名」等として明示した表記（あれば）
#   note      判断材料
zh_variants:

  # ═══ ポッピンパーティ ═══
  - japanese: 戸山香澄
    official: 户山香澄
    note: 出典の本名欄「戸山（とやま）香澄（かすみ）」。別訳の記載なし

  - japanese: 花園たえ
    official: 花园多惠
    alt: [花园妙, 花园多英]
    note: |
      ★ 本表で唯一「別訳」が複数ある例。出典の「译名」欄に
      **花园多惠、花园妙、花园多英** の 3 つが併記されている。
      どれを採るかは**運用側の判断**——本 Skill は既定を決めない。
      ⚠ 日本語名は**仮名「たえ」**で、漢字表記は存在しない

  - japanese: 牛込りみ
    official: 牛込里美
    note: |
      出典の本名欄「牛込（うしごめ）りみ」。日本語は**仮名「りみ」**。
      「里美」の日本語起源は不明（当て字の可能性）

  - japanese: 山吹沙綾
    official: 山吹沙绫
    note: 出典の本名欄「山吹（やまぶき）沙綾（さあや）」。简体字で「绫」

  - japanese: 市ヶ谷有咲
    official: 市谷有咲
    note: |
      出典は「市谷有咲」——日本語の「ヶ」が中文では「谷」に簡略化される。
      **日本語正文では「市ヶ谷」**（小書き片仮名「ヶ」）を使う

  # ═══ マイゴ ═══
  - japanese: 高松燈
    official: 高松灯
    note: 日本語は旧字体「燈」、簡体字は「灯」。日本語正文では「燈」を维持

  - japanese: 千早愛音
    official: 千早爱音
    note: |
      出典の本名欄「千早（ちはや）愛音（あのん）」。
      愛称「あのちゃん」の中文訳は「小爱」が定着（出典の別号欄）

  - japanese: 要楽奈
    official: 要乐奈
    note: 出典の本名欄「要（かなめ）楽奈（らーな）」。読みは**らーな**（長音符付き）

  - japanese: 椎名立希
    official: 椎名立希
    note: 出典の本名欄「椎名（しいな）立希（たき）」

  - japanese: 長崎そよ
    official: 长崎爽世
    alt: [长崎素世]
    community: 长崎素世
    note: |
      ★ 本表で唯一「community」を記録できる例。
      出典に「长崎爽世、**长崎素世（早期译名）**」と明記されているため、
      「素世」を早期訳として community に置ける（推測ではなく出典由来）。
      ⚠ 日本語名は**仮名「そよ」**。「爽世」はアニメ脚本家が後から定めた漢字名
      （原文假名，详见 characters/mygo/soyo.md）

