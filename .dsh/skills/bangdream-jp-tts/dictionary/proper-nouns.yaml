# ─────────────────────────────────────────────────────────────
# 角色
# ─────────────────────────────────────────────────────────────
# ★ `zh` フィールド = その角色の**中文名**（百科の本名/译名欄から転記）。
#
#   中文名の**正体はここ 1 箇所だけ**。同じ値を別の場所にも保存すると、
#   片方だけ直して必ず食い違う（実際に一度そうなり、validator で一致を
#   強制する羽目になった）。そこで：
#
#     characters[].zh            中文名（Gate B の official に相当）
#     characters[].zh_alt        出典に併記された別訳（あれば）
#     characters[].zh_community  出典が「早期译名」等として明示した表記（あれば）
#
#   Gate B が読む「译名の一覧」は **validator が characters から導出**する。
#   ファイルには保存しない（保存すると上の二重管理に逆戻りするため、
#   保存されていたら validator が fail する）。
#
#   補完済みは**ポッピンパーティとマイゴの 2 バンドのみ**（ユーザー指定）。
#   他バンドは未補完——推測で埋めず、必要になったら出典で確認してから追加する（G8）。
#   詳細はファイル下部の説明を参照。
#
#   なお `kana`（日本語の読み）とは別物。混同しないこと。
