# 专有名词统一表
#
# 用途：保证专有名词在整个项目内只有一种写法（rules/global.md G7）。
#       称呼对应表（G6）は dictionary/address-forms.yaml に分離済み。
#
# 原则：
#   - canonical 是**唯一**允许的写法。AI 翻译出现其他写法一律改成 canonical。
#   - **词典里没有的专有名词不要猜**（G8）。列入 unregistered 待补。
#   - 读音风险高的条目同时登记在 pronunciation.yaml。
#
# ★ 与 G9（英文转写为假名）的关系 —— 2026-02-14 已确定 TTS 引擎为 GPT-SoVITS
#
#   G9 在本项目下**无条件生效**：正文中的英字一律转写为片假名，**无例外**。
#   （理由见 adapters/gpt-sovits.md：GPT-SoVITS 对拉丁字母走英语 G2P，
#     产出英语音素而非日式外来语读音，角色听感会变成"在说英语"。）
#
#   因此本词典的 `canonical` 是**正文中实际使用的表记**：
#     · 原本是英字的条目 → canonical 为片假名，拉丁原表記记在 `latin` 供追溯
#     · 原本就是假名/汉字的条目 → canonical 不变，不反向改成英字
#
#   仍然不做的：**机械音译**。canonical 取日语中实际使用的那个词
#   （Smartphone → スマホ，不是 スマートフォン 的机械拼读）。

