      ★ 「クライシック」和「クラシック」**片假名相近**。
        在 TTS 中有混淆风险，因此登记到 pronunciation.yaml

# ─────────────────────────────────────────────────────────────
# 角色
# ─────────────────────────────────────────────────────────────
# ★ `zh` 字段 = 该角色的**中文名**（从百科的本名/译名栏转记）。
#
#   中文名的**正体只有这一处**。把同一个值也保存在别处，
#   就必然会只改一边而互相矛盾（实际上曾一度如此，最后不得不用 validator
#   强制一致）。因此：
#
#     characters[].zh            中文名（相当于 Gate B 的 official）
#     characters[].zh_alt        出典中并列记载的别译（如有）
#     characters[].zh_community  出典明示为「早期译名」等的表记（如有）
#
#   Gate B 读取的「译名一览」由 **validator 从 characters 导出**。
#   不保存进文件（因为保存就会退回上面的双重管理，
#   一旦被保存 validator 就会 fail）。
#
#   已补齐的**只有 ポッピンパーティ 和 マイゴ 这 2 个乐队**（用户指定）。
#   其他乐队未补齐——不要靠推测填补，需要时先到出典确认再追加（G8）。
#   详情参见文件下部的说明。
#
#   另外，它与 `kana`（日语的读音）不是一回事。不要混淆。
