    latin: RAISE A SUILEN
    members: [レイヤ, ロック, マスキング, パレオ, チュチュ]
    note: 略称 RAS（読み アールエーエス。本文で使うなら片仮名で）

  - canonical: マイゴ
    latin: MyGO!!!!!
    members: [高松燈, 千早愛音, 要楽奈, 長崎そよ, 椎名立希]
    note: |
      英字表記の「!!!!!」5つは転写により消える。
      正文「マイゴ」に感嘆符は**付けない**——原表記の記号を本文に持ち込まない

  - canonical: アヴェムジカ
    latin: Ave Mujica
    note: 表記は英字だが、G9 により正文は片仮名

  - canonical: グリッターグリーン
    members: [戸山明日香]
    note: |
      香澄の妹・明日香のバンド。元から仮名のため転写対象外。
      カタカナ表記の「グ」と「グリーン」を変えない

  - canonical: バンドリ
    latin: BanG Dream!
    note: |
      作品名。**公式の読みは「バンドリ」**（「バンドリーム」ではない）。
      この点は要ユーザー確認（2026-02-14 時点で未確認）。
      英字表記の半角 `!` は転写により消える。本文に記号を持ち込まない

  - canonical: CRYCHIC
    note: |
      ⚠️ **canonical が英字のまま**——G9（英字は片仮名に転写）の唯一の未解決項目。
      ライブで解散した旧バンド名。G9 の例外 3 類（識別子 / 非朗読 / 既に仮名）
      のいずれにも該当しないため、本来は片仮名化が必要。
      しかし**公式の仮名形が未確認**のため、推測で埋めない（G8）。
      → 確認できるまで**本文でこの語を使わない**。使用が必要な場面では【待確認】に出す。
      → 確認後 canonical を仮名に変更し、latin: CRYCHIC を付ける

  - canonical: クライシック
    status: 使用禁止
    note: |
      上記 CRYCHIC の仮名形として**ありうる**表記だが、確認が取れていない。
      推測で使わないための記録として残す。本文では使用しない

