# 专有名词统一表
#
# 用途：保证专有名词在整个项目内只有一种写法（rules/global.md G7），
#       并提供角色间称呼对应表以校验人物关系（G6）。
#
# 原则：
#   - canonical 是**唯一**允许的写法。AI 翻译出现其他写法一律改成 canonical。
#   - **词典里没有的专有名词不要猜**（G8）。列入 unregistered 待补。
#   - 读音风险高的条目同时登记在 pronunciation.yaml。
#
# ★ 与 G9（英文默认转写为假名）的关系：
#   `rules/global.md` G9 要求正文中的英文转写成片假名，但**本词典的 canonical 是例外 1**。
#   凡 canonical 为英字表记的条目（Poppin'Party / Roselia / BanG Dream! 等），
#   保留英字原样，**不得转写成片假名**——那是改变专有名词，违反 G7。
#   这些条目的读音由 pronunciation.yaml 或引擎的专有名词处理负责，
#   不由改写正文负责。详见 G9 的「例外」小节。

