# ─────────────────────────────────────────────────────────────
# 中文译名（Gate B）—— **派生视图。不保存在这里**
# ─────────────────────────────────────────────────────────────
# 中文名的正体是 **characters 节**（各角色的 zh / zh_alt / zh_community）。
# zh_variants 由 validator 从 characters 导出并检查。
# 不保存进文件的理由：同一个值放在 2 处，就必然只改一边而互相矛盾。
# （实际上曾一度如此，最后不得不用 validator 强制一致）
#
#   characters[].zh            中文名（= 旧 zh_variants 的 official）
#   characters[].zh_alt        出典中并列记载的别译（如有）
#   characters[].zh_community  出典明示为「早期译名」等的表记（如有）
#
# 規則：
#   - 选定后即为该批次的 canonical，**同一批次内不得混用**（G7 的精神）
#   - 它决定的只是「用哪种表记」。「是否应该改」它不决定
#   - 日语正文的表记以 characters 的 canonical 为正（例：日语始终是「そよ」）
#   - 出典中没有的表记**不要靠推测补上**（G8）
#
# 已补齐的**只有 ポッピンパーティ 和 マイゴ 这 2 个乐队**（用户指定）。
# 其他乐队未补齐——需要时先到出典确认再追加到 characters。

