# ─────────────────────────────────────────────────────────────
# 称呼对应表 —— 用于 G6 人物关系一致性检查
# ─────────────────────────────────────────────────────────────
# 写清上三角（谁怎么叫谁）。同场景内必须稳定，中途不得切换。
address_forms:

  戸山香澄:
    市ヶ谷有咲: [有咲, ありさ]
    花園たえ: [たえ, たえちゃん]
    牛込りみ: [りみ, りみりん]
    山吹沙綾: [沙綾, さーや]
    湊友希那: [友希那さん, 友希那先輩]
    目上: [姓 + さん, 姓 + 先生]
    初対面: [姓 + さん]
    note: |
      「りみりん」「さーや」は親密な愛称。関係構築後でのみ使用。
      初対面の場面では使わない

  市ヶ谷有咲:
    戸山香澄: [香澄]
    花園たえ: [たえ]
    牛込りみ: [りみ]
    山吹沙綾: [沙綾]
    note: 有咲は基本的に名字でなく名前で呼ぶ。ツンデレ的な呼び捨て

  花園たえ:
    戸山香澄: [香澄]
    市ヶ谷有咲: [有咲]
    牛込りみ: [りみ]
    山吹沙綾: [沙綾]
    note: 基本的に呼び捨て。たえの口調は独特なので rules_file 参照

  # 未登録の組み合わせは**推測しない**（G8）。
  # 必要になったら公式台詞を確認して追記する。

