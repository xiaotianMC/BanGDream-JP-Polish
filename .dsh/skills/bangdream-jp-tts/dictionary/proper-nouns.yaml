      ★ 中国語名は**両方とも正しい**（ユーザー確認 2026-02-14）：
        - 官方偏好 → `长崎爽世`（Gate B の official）
        - 社区偏好 → `长崎素世`（Gate B の community）
        どちらを選ぶかは Gate B の選択であって、**正誤ではない**。
      ★ **旧名は `一ノ瀬そよ`（一之瀬爽世）**：
        家庭は元々裕福ではなく、**小学 5 年生の時に両親が離婚**して
        **母の姓「長崎」に改姓**した。→ 発話時点でどちらの姓かが問題になる。
        「一ノ瀬」の時期の台詞を書く場合、**姓の使い分けに注意**（G8：場面の時期を確認する）

