      正文では必ず片仮名「スミミ」。
      もう一人の成員 三角初華 は `バンド: アヴェムジカ` として登録済みで、
      **スミミ側のメンバーには数えない**（ファイルを二重に持たないため）。
      ユニット名の由来（純田 + 三角）は**出典自身が「可能」と留保**している

  - canonical: クライシック
    latin: CRYCHIC
    members: []
    status: 解散
    note: |
      ✅ **片仮名形は確認済み（2026-02-14）**：`クライシック`。
      出典（萌娘百科 CRYCHIC rev.8548918）の简介に
      「队名 **CRYCHIC（クライシック）** 还与 CLASSIC（クラシック）（古典的）
      片假名相近，因此在祥子提出时被睦误会」と明記されている。
      → **G9 の唯一の未解決項はこれで解消**。英字 CRYCHIC は `latin` に保持し、
        正文では「クライシック」を使う。
      ★ `members: []` は意図的。5 人全員が他バンドにファイルを持ち、
        同じ人物の言語ルールを 2 箇所に置かないため
        （characters/crychic/_band.md 参照）
      ★ 「クライシック」と「クラシック」は**片仮名が近い**。
        TTS では混同リスクがあるため pronunciation.yaml に登録する

# ─────────────────────────────────────────────────────────────
# 角色
# ─────────────────────────────────────────────────────────────
# ★ `zh` フィールド = その角色の**中文名**（百科の本名/译名欄から転記）。
#
#   中文名の**正体はここ 1 箇所だけ**。同じ値を別の場所にも保存すると、
#   片方だけ直して必ず食い違う（実際に一度そうなり、validator で一致を
#   強制する羽目になった）。そこで：
#
#     characters[].zh            中文名（Gate B の official に相当）
#     characters[].zh_alt        出典に併記された別訳（あれば）
#     characters[].zh_community  出典が「早期译名」等として明示した表記（あれば）
#
#   Gate B が読む「译名の一覧」は **validator が characters から導出**する。
#   ファイルには保存しない（保存すると上の二重管理に逆戻りするため、
#   保存されていたら validator が fail する）。
#
#   補完済みは**ポッピンパーティとマイゴの 2 バンドのみ**（ユーザー指定）。
#   他バンドは未補完——推測で埋めず、必要になったら出典で確認してから追加する（G8）。
#   詳細はファイル下部の説明を参照。
#
#   なお `kana`（日本語の読み）とは別物。混同しないこと。
