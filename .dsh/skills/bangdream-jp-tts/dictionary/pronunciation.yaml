# ─────────────────────────────────────────────────────────────
# ★ 用户已确认的读音（2026-02-14）
# ─────────────────────────────────────────────────────────────
# 注意 `verified` 的含义。这里的 `verified: true` 表示的是
#   **「用户已确认读音是正确的」**
# ——仅此而已。**TTS 是否真的按此发音是另一回事，依然是 unverified**
# （参见后文的 `unverified` 段）。混淆二者会导致
# 「既然已确认，就不需要实机验证」这种错误的安心感。
#
# 首次出现：用户在 2026-02-14 的评审中明确列出的确认清单。
# 出典（萌娘百科）中没有读音记载的条目很多，按 G8
# 此前一直作为「未确认」而避免在正文中使用的词。
#
