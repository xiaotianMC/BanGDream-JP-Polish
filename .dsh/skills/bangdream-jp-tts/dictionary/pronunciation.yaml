# ─────────────────────────────────────────────────────────────
# 待确认 —— 尚未验证的读音风险
# ─────────────────────────────────────────────────────────────
# 规则：不确定就读不准的，写在这里，不要在生成文本时静默选一个（Global G8）。
unverified:

  - item: 全部条目
    issue: |
      verified: false 的项目全部**未验证**。
      引擎已确定为 GPT-SoVITS，但尚未进行实际合成的听感确认。
      ★ `verified_readings` 的项目也只是**读音已确认，TTS 实机验证尚未实施**。
    action: |
      执行 `../adapters/gpt-sovits.md` 的「验证清单」，并把结果回填到这里。
      确认项目：
        1. 是否按上述 reading 读出
        2. 促音（ほんっとに）是否被发音
        3. 长音（ー）是否被适当拉长
        4. 数字的表记（3人 / 三人）是否会让行为改变
        5. 片假名转写后的词（ポッピンパーティ 等）是否被正确读出
    priority: high
    engine: GPT-SoVITS

  - item: 促音「っ」的处理
    issue: |
      GPT-SoVITS 是否会把「ほんっとに」中的小写「っ」正确处理为促音，尚不明确。
      文本前端可能直接按表记音素化，导致不自然。
    action: 执行 adapters/gpt-sovits.md 验证清单 C。若有问题则研究规避方案
    priority: high
    engine: GPT-SoVITS

  - item: 地名的误读（小豆島）
    issue: |
      **把小豆島 误读成 あずきじま 的可能性最高**。
      在圣地巡礼脚本中，专有名词误读会是最显眼的失败。
    action: |
      最优先实测。如果会误读，可选方案：
        1. 登记到 pronunciation.yaml 的 frontend 词典（GPT-SoVITS 侧的设置）
        2. 正文用片假名写成「ショウドシマ」
        3. 用平假名写成「しょうどしま」
      → 采用哪一个，要等确认引擎的词典功能是否可用之后再决定（未确认）
    priority: high
    engine: GPT-SoVITS

  - item: 片假名转写后的读音
    issue: |
      按 G9 把英字转写成片假名的词（ポッピンパーティ / レイズアスイレン /
      アヴェムジカ 等）是否按预期读出，尚未确认。
      含「ヴ」的词（アヴェムジカ）会因引擎而在 ブ 和 ヴ 之间摇摆。
    action: 执行 adapters/gpt-sovits.md 验证清单 B
    priority: high
    engine: GPT-SoVITS
