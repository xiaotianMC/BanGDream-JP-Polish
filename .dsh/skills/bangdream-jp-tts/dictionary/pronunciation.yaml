# 读音词典
#
# 用途：TTS 层的读音风险规避（rules/tts.md T3）。
#
# ── 引擎已确定（2026-02-14）──────────────────────────────────
engine:
  name: GPT-SoVITS
  status: confirmed
  verified: false        # 未实际合成验证。見 adapters/gpt-sovits.md
  adapter: adapters/gpt-sovits.md
#
# 引擎确定后的三条影响：
#   1. 英字は G9 により**無条件で片仮名に転写**。本词典に英字エントリを
#      追加する意味は薄い——转写した片仮名を登録する
#   2. 片仮名は字符と読みがほぼ一対一なので、**片仮名化自体が誤読対策**になる
#   3. 促音「っ」・長音「ー」の挙動は要実測（adapters/gpt-sovits.md 検証清单 C）
#
# 填写原则：
#   - 只填**真的会误读**的条目。常用词不要塞进来，会稀释信噪比。
#   - reading 只写读音，不要写罗马字。
#   - engine 字段：null = 通用；填引擎名 = 仅该引擎需要特殊处理。
#   - **不确定的读音写 verified: false 并列入待确认，不要猜**（Global G8）。
#
# 字段：
#   word      原表记
#   reading   期望读音（假名）
#   reason    为什么需要（TTS pronunciation / 多音字 / 专有名词 …）
#   verified  是否已用真实 TTS 验证过
#   engine    适用引擎，null 为通用

version: 0
updated: 2026-02-14

# ─────────────────────────────────────────────────────────────
# 角色名 —— 最高风险。当用汉字几乎必然误读
# ─────────────────────────────────────────────────────────────
character_names:

  # ★ 最高リスク項目 —— 「燈」は あかり と誤読されやすい。
  #   原作でも道人が「あかり」と読み間違える場面がある。
  #   GPT-SoVITS も同じ誤りを犯す可能性が高い（adapters/gpt-sovits.md 参照）。
  - word: 燈
    reading: ともり
    reason: |
      TTS pronunciation — **あかり と誤読する可能性が極めて高い**。
      動詞「灯（とも）る」の名詞形に由来する希少な読み。
      名前のため**書き換えによる回避ができない**（T5 veto の適用外）
    verified: false
    engine: GPT-SoVITS
    note: |
      高松燈（たかまつ ともり）。読みの希少さ自体が原作の要素。
      回避手段の優先順位：
        1. 本エントリの登録（実施済み）
        2. GPT-SoVITS 側のフロントエンド辞書に登録
        3. 最終手段として本文を「ともり」と仮名表記
      名前は G7 により表記統一が必須のため、安易に仮名化しない

  - word: 高松
    reading: たかまつ
    reason: TTS pronunciation — 姓の読み
    verified: false
    engine: GPT-SoVITS
    note: 読みの異形は考えにくいが、名と連続するため誤読の連鎖に注意

  - word: 氷川
    reading: ひかわ
    reason: |
      TTS pronunciation — 「氷」を こおり と読む誤りが起きやすい。
      氷川紗夜（ロゼリア）・氷川日菜（パステルパレット）の姉妹で頻出
    verified: false
    engine: GPT-SoVITS
    note: 読みは ひかわ。「ひょうかわ」等にも注意

  # ── MyGO!!!!! メンバー（2026-08-31 追加）──
  # 灯以外の 4 名も当用漢字の難読揺れが大きい。

  - word: 愛音
    reading: あのん
    reason: |
      TTS pronunciation — **あいね と誤読する可能性が高い**。
      「愛」→あい、「音」→ね という通常の連想から外れる
    verified: false
    engine: GPT-SoVITS
    note: 千早愛音。読みの意外さはキャラ設定の一部。名前は書き換え不可（G7）

  - word: 楽奈
    reading: らーな
    reason: |
      TTS pronunciation — **らくな と誤読する可能性が高い**。
      「楽」→らく、「奈」→な の直読を避ける必要がある
    verified: false
    engine: GPT-SoVITS
    note: |
      要楽奈。**長音符付きの「らーな」**が正しい（「らな」ではない）。
      「ー」を正しく伸ばすかは要実測（adapters/gpt-sovits.md 検証清单 C）

  - word: 立希
    reading: たき
    reason: |
      TTS pronunciation — **りっき と誤読する可能性**。
      同一作品内に「りっきー」というニックネームがあり混同しやすい
    verified: false
    engine: GPT-SoVITS
    note: 椎名立希。`りっきー` は**愛音が押し付けた別名**で、名前の読みではない

  - word: そよ
    reading: そよ
    reason: |
      TTS pronunciation — **仮名表記なので誤読リスクは低い**。
      ただし漢字表記「爽世」を使うと そうせい / そうよ 等に誤読される
    verified: false
    engine: GPT-SoVITS
    note: |
      長崎そよ。**名前は仮名「そよ」が正**（「爽世」は後付けの漢字名）。
      本文でも仮名を使うのが原作準拠かつ TTS 安全

