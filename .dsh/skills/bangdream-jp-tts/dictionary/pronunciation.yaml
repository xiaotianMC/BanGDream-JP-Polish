# ─────────────────────────────────────────────────────────────
# ★ 用户確認済みの読み（2026-02-14）
# ─────────────────────────────────────────────────────────────
# `verified` の意味に注意。ここでの `verified: true` は
#   **「読みが正しいことをユーザーが確認した」**
# を表す。**TTS が実際にその通り発音するかは別問題で、依然 unverified**
# （後述の `unverified` 節を参照）。混同すると
# 「確認済みだから実機検証も不要」という誤った安心につながる。
#
# 初出：ユーザーが 2026-02-14 のレビューで明示的に列挙した確認リスト。
# 出典（萌娘百科）に読みの記載が無い項目が多く、G8 により
