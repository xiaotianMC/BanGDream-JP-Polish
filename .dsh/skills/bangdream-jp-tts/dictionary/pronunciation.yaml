# 读音词典
#
# 用途：TTS 层的读音风险规避（rules/tts.md T3）。
#
# ── 引擎已确定（2026-02-14）──────────────────────────────────
engine:
  name: GPT-SoVITS
  status: confirmed
  verified: false        # 未实际合成验证。参见 adapters/gpt-sovits.md
  adapter: adapters/gpt-sovits.md
#
# 引擎确定后的三条影响：
#   1. 英字按 G9 **无条件转写为片假名**。在本词典中追加英字条目
#      意义不大——登记转写后的片假名
#   2. 片假名的字符与读音几乎一一对应，**片假名化本身就是误读对策**
#   3. 促音「っ」・长音「ー」的行为需要实测（adapters/gpt-sovits.md 验证清单 C）
#
# 填写原则：
#   - 只填**真的会误读**的条目。常用词不要塞进来，会稀释信噪比。
#   - reading 只写读音，不要写罗马字。
#   - engine 字段：null = 通用；填引擎名 = 仅该引擎需要特殊处理。
#   - **不确定的读音写 verified: false 并列入待确认，不要猜**（Global G8）。
#
# 字段：
#   word      原表记
#   reading   期望读音（假名）
#   reason    为什么需要（TTS pronunciation / 多音字 / 专有名词 …）
#   verified  是否已用真实 TTS 验证过
#   engine    适用引擎，null 为通用

version: 0
updated: 2026-02-14

# ─────────────────────────────────────────────────────────────
# 角色名 —— 最高风险。用常用汉字写几乎必然误读
# ─────────────────────────────────────────────────────────────
character_names:

  # ★ 最高风险条目 —— 「燈」容易被误读成 あかり。
  #   原作中也有路人把它读错成「あかり」的场面。
  #   GPT-SoVITS 也很可能犯同样的错误（参见 adapters/gpt-sovits.md）。
  - word: 燈
    reading: ともり
    reason: |
      TTS pronunciation — **被误读成 あかり 的可能性极高**。
      源自动词「灯（とも）る」的名词形，是稀有的读音。
      因为是名字，**无法通过改写来规避**（T5 veto 的适用范围之外）
    verified: false
    engine: GPT-SoVITS
    note: |
      高松燈（たかまつ ともり）。读音的稀有性本身就是原作的要素。
      规避手段的优先顺序：
        1. 登记本条目（已完成）
        2. 登记到 GPT-SoVITS 侧的前端词典
        3. 作为最后手段，把正文用假名写成「ともり」
      名字按 G7 必须统一表记，因此不要轻易改成假名

  - word: 高松
    reading: たかまつ
    reason: TTS pronunciation — 姓氏的读音
    verified: false
    engine: GPT-SoVITS
    note: 读音的异形不太可能出现，但与名字连续，注意误读的连锁

  - word: 氷川
    reading: ひかわ
    reason: |
      TTS pronunciation — 容易把「氷」误读成 こおり。
      在姐妹 氷川紗夜（ロゼリア）・氷川日菜（パステルパレット）身上高频出现
    verified: false
    engine: GPT-SoVITS
    note: 读音是 ひかわ。也要注意「ひょうかわ」等

  # ── MyGO!!!!! 成员（2026-08-31 追加）──
  # 除灯以外的 4 人，常用汉字的难读与摇摆也很大。

  - word: 愛音
    reading: あのん
    reason: |
      TTS pronunciation — **被误读成 あいね 的可能性很高**。
      脱离了「愛」→あい、「音」→ね 这种通常的联想
    verified: false
    engine: GPT-SoVITS
    note: 千早愛音。读音的出人意料是角色设定的一部分。名字不可改写（G7）

  - word: 楽奈
    reading: らーな
    reason: |
      TTS pronunciation — **被误读成 らくな 的可能性很高**。
      需要避免按「楽」→らく、「奈」→な 直接读
    verified: false
    engine: GPT-SoVITS
    note: |
      要楽奈。正确的是**带长音符的「らーな」**（不是「らな」）。
      「ー」能否正确拉长需要实测（adapters/gpt-sovits.md 验证清单 C）

  - word: 立希
    reading: たき
    reason: |
      TTS pronunciation — **有被误读成 りっき 的可能**。
      同一作品内有「りっきー」这个昵称，容易混淆
    verified: false
    engine: GPT-SoVITS
    note: 椎名立希。`りっきー` 是**愛音硬塞给她的别名**，不是名字的读音

  - word: そよ
    reading: そよ
    reason: |
      TTS pronunciation — **因为写的是假名，误读风险低**。
      但若使用汉字表记「爽世」，会被误读成 そうせい / そうよ 等
    verified: false
    engine: GPT-SoVITS
    note: |
      長崎そよ。**名字以假名「そよ」为正**（「爽世」是后来追加的汉字名）。
      正文中也使用假名，既符合原作又对 TTS 安全

  # ── ポッピンパーティ 成员（2026-09-02 追加）──

  - word: たえ
    reading: たえ
    reason: TTS pronunciation — **因为写的是假名，误读风险低**
    verified: false
    engine: GPT-SoVITS
    note: |
      花園たえ。不存在汉字表记（出典的「多惠」是中文表记，日语起源不明）。
      **因为是假名，对 TTS 来说最安全**。`おたえ` 也一样

  - word: りみ
    reading: りみ
    reason: TTS pronunciation — **因为写的是假名，误读风险低**
    verified: false
    engine: GPT-SoVITS
    note: 牛込りみ。`牛込`（うしごめ）已另行登记。只有姓氏是汉字

  - word: 沙綾
    reading: さあや
    reason: |
      TTS pronunciation — **容易被误读成「さや」**（有无长音）。
      同一作品内还存在「さーや」这个称呼，容易混淆
    verified: false
    engine: GPT-SoVITS
    note: |
      山吹沙綾。**「さあや」是本名的读音**，「さーや」是称呼。
      读音相同但表记不同。设想传给 TTS 时是同一个音

  - word: 有咲
    reading: ありさ
    reason: |
      TTS pronunciation — **容易被误读成「ゆうさき」等**。
      把「咲」读成 さき 的联想很强
    verified: false
    engine: GPT-SoVITS
    note: 市ヶ谷有咲。「咲」读 さ

  - word: 牛込
    reading: うしごめ
    reason: |
      TTS pronunciation — **容易被误读成「ぎゅうこみ」等**。
      在 牛込さん（友希那・紗夜・燐子・麻弥使用）中高频出现
    verified: false
    engine: GPT-SoVITS
    note: 牛込りみ的姓

  - word: 戸山
    reading: とやま
    reason: |
      TTS pronunciation — 有把「戸」读成 こ 的可能。
      在 戸山さん（麻弥・友希那・紗夜・燐子・美咲使用）中高频出现
    verified: false
    engine: GPT-SoVITS
    note: 戸山香澄的姓

  - word: 香澄
    reading: かすみ
    reason: TTS pronunciation — 把「香」读成「こう」的可能性很高
    verified: false
    engine: null

  - word: 市ヶ谷
    reading: いちがや
    reason: TTS pronunciation — 「ヶ」的读音（が / け / ガ）不稳定
    verified: false
    engine: null

  - word: 友希那
    reading: ゆきな
    reason: TTS pronunciation — 把「希」读成「き」属于难读
    verified: false
    engine: null

  - word: 湊
    reading: みなと
    reason: TTS pronunciation — 「湊」的读音有多个
    verified: false
    engine: null

  - word: 美竹蘭
    reading: みたけらん
    reason: TTS pronunciation — 人名难读
    verified: false
    engine: null

  - word: 青葉モカ
    reading: あおばもか
    reason: TTS pronunciation — 姓氏的读音
    verified: false
    engine: null

  - word: 上原ひまり
    reading: うえはらひまり
    reason: TTS pronunciation — 姓氏的读音
    verified: false
    engine: null

  - word: 羽丘
    reading: はねおか
    reason: TTS pronunciation — 学校名。源自地名的读音
    verified: false
    engine: null

  # ── レイズアスイレン 成员（2026-09-02 追加）──
  # 读音已在出典的本名栏确认。★ 标记表示不能按字面直读的条目。

  - word: 鳰原
    reading: にゅうばら
    reason: |
      TTS pronunciation — ★ **误读风险最高**。
      「鳰」是难读字，无法直读成 にゅうばら。
      很有可能会读成 において はら / におはら 等
    verified: false
    engine: GPT-SoVITS
    note: |
      鳰原令王那（PAREO）。出典的本名栏「鳰原（にゅうばら）」。
      ⚠ 以前本词典曾把它误记成「におはら」，后来修正过

  - word: 珠手
    reading: たまで
    reason: |
      TTS pronunciation — ★ **容易被误读成 しゅて**。
      把「珠」直读成 しゅ、「手」直读成 て 的联想很强
    verified: false
    engine: GPT-SoVITS
    note: 珠手知由（CHU²）。出典的本名栏「珠手（たまで）」。名字是假名「ちゆ」

  - word: 六花
    reading: ろっか
    reason: |
      TTS pronunciation — ★ **容易被误读成 りっか / ろくはな 等**。
      促音 + 拨音的组合
    verified: false
    engine: GPT-SoVITS
    note: |
      朝日六花（LOCK）。出典的本名栏「六花（ろっか）」。
      因为 Afterglow 会用本名「六花」称呼她，正文中的出现频率很高

  - word: 令王那
    reading: れおな
    reason: |
      TTS pronunciation — ★ **容易被误读成 れいおうな / れおうな 等**。
      三个字对应三拍这种不规则对应
    verified: false
    engine: GPT-SoVITS
    note: 鳰原令王那。只有知由用本名「令王那」称呼

  - word: 和奏
    reading: わかな
    reason: TTS pronunciation — 容易被误读成「わそう」等
    verified: false
    engine: GPT-SoVITS
    note: |
      和奏レイヤ。出典中关于姓氏由来写着「和与奏这两个字很适合 LAYER」。
      ★ **本名不是「レイヤ」而是「レイ」**（出典的本名栏「レイ」）

  - word: 佐藤
    reading: さとう
    reason: TTS pronunciation — 虽然是普通姓氏，但作为人名登记
    verified: false
    engine: GPT-SoVITS
    note: 佐藤益木。名字「ますき」是**假名**，所以没有误读风险

  # ── ロゼリア 成员（2026-09-02 追加）──
  # 读音已在出典的本名栏确认。★ 标记表示不能按字面直读的条目。

  - word: 白金
    reading: しろかね
    reason: |
      TTS pronunciation — ★ **误读风险最高**。
      「白金」是金属名，和 はっきん 的联想极强，
      与人名的 しろかね 无法直接挂钩
    verified: false
    engine: GPT-SoVITS
    note: 白金燐子。出典的本名栏「白金（しろかね）燐子（りんこ）(Shirokane Rinko)」

  - word: 燐子
    reading: りんこ
    reason: |
      TTS pronunciation — ★ 「燐」是**常用汉字表和人名用汉字表中都没有的字**
      （出典中有注记）。很难靠推测得出读音
    verified: false
    engine: GPT-SoVITS
    note: 白金燐子。把「燐」读成 りん 属于难读

  - word: 紗夜
    reading: さよ
    reason: TTS pronunciation — 容易被误读成「さや」（虽不是长音，但联想很强）
    verified: false
    engine: GPT-SoVITS
    note: 氷川紗夜。★ 不要和双胞胎妹妹「日菜」混淆（ひな）

  - word: 宇田川
    reading: うだがわ
    reason: TTS pronunciation — 容易被误读成「うたがわ」
    verified: false
    engine: GPT-SoVITS
    note: |
      宇田川あこ（ロゼリア）和宇田川巴（アフターグロウ）**姐妹共用**。
      一旦误读，两人会同时崩掉，因此优先级很高

  # ── アヴェムジカ 成员（2026-09-06 追加）──
  # 读音已在出典的本名栏确认。★ 标记表示不能按字面直读的条目。

  - word: 睦
    reading: むつみ
    reason: |
      TTS pronunciation — ★ 容易被套上「むつき」「むつみ」以外的读音。
      只是名字的一部分，单独出现时读音无法确定
    verified: false
    engine: GPT-SoVITS
    note: 若葉睦。★ 有**另一个人格「モーティス」**，自称分成三种（mutsumi.md）

  - word: 海鈴
    reading: うみり
    reason: |
      TTS pronunciation — ★ 把「鈴」读成 すず 的联想很强，
      容易被误读成 うみすず
    verified: false
    engine: GPT-SoVITS
    note: 八幡海鈴。「贝斯雇佣兵」——有同时支援 30 个乐队的经历

  - word: 三角
    reading: みすみ
    reason: |
      TTS pronunciation — ★ **容易被误读成「さんかく」**。
      作为普通名词的读音印象极强
    verified: false
    engine: GPT-SoVITS
    note: 三角初華。★ 姓氏与普通名词同形，因此误读风险很高

  - word: 初華
    reading: ういか
    reason: |
      TTS pronunciation — ★ 容易被误读成「はつか」「はつはな」等。
      把「初」读成 はつ 的联想很强
    verified: false
    engine: GPT-SoVITS
    note: |
      三角初華。★ **同一个人还有第二个名字「初音（はつね）」**（双重名义）。
      读哪一个取决于上下文——从 TTS 角度需要特别注意

  - word: 初音
    reading: はつね
    reason: TTS pronunciation — 容易被误读成「はつおと」
    verified: false
    engine: GPT-SoVITS
    note: 三角初華的另一个名义。祥子有称呼她为「初音」的场面（uika.md）

  - word: 豊川
    reading: とがわ
    reason: |
      TTS pronunciation — ★ 容易被误读成「とよかわ」「ほうかわ」等
    verified: false
    engine: GPT-SoVITS
    note: 豊川祥子。★ 第一人称是「私（わたくし）」

  - word: 祐天寺
    reading: ゆうてんじ
    reason: |
      TTS pronunciation — 也是寺庙的名字，作为人名的读音难以确定
    verified: false
    engine: GPT-SoVITS
    note: |
      祐天寺若麦。★ **名字是平假名「にゃむ」**，所以没有误读风险。
      只有姓氏是汉字

# ─────────────────────────────────────────────────────────────
# 地名 —— 在圣地巡礼脚本中高频出现。难读地名误读风险高
# ─────────────────────────────────────────────────────────────
# 2026-02-14 追加。包含用户指定的 3 条（小豆島 / 安房鴨川 / 逗子・葉山）。
# 详细的表记统一参见 proper-nouns.yaml 的 places 段。
place_names:

  - word: 小豆島
    reading: しょうどしま
    reason: TTS pronunciation — **被误读成 あずきじま 的可能性很高**。最高风险
    verified: false
    engine: GPT-SoVITS
    note: |
      香川県。因为「小豆」＝あずき 的联想，容易误读。
      写成片假名「ショウドシマ」确实可靠，但正文可读性会下降。
      通常以汉字原样 + 本条目 + 实测来应对

  - word: 安房鴨川
    reading: あわかもがわ
    reason: TTS pronunciation — 「安房」是旧国名，读 あわ。难读
    verified: false
    engine: GPT-SoVITS
    note: |
      千葉県。站名「安房鴨川駅」读 あわかもがわえき。
      如果想让它按「あわ-かもがわ」断开来读，需要调整（未验证）

  - word: 逗子
    reading: ずし
    reason: TTS pronunciation — 「逗」的读音（とう / ず）不稳定
    verified: false
    engine: GPT-SoVITS

  - word: 葉山
    reading: はやま
    reason: TTS pronunciation — 地名的读音
    verified: false
    engine: GPT-SoVITS
    note: 「逗子・葉山」中的「・」不读出。并列表记

  - word: 江の島
    reading: えのしま
    reason: TTS pronunciation — 有把「江」读成 こう 的可能
    verified: false
    engine: GPT-SoVITS
    note: 表记统一为「江の島」（不要与「江ノ島」混用）

  - word: 神戸
    reading: こうべ
    reason: TTS pronunciation — 有误读成「しんこ」等的可能
    verified: false
    engine: GPT-SoVITS

