# 称呼对应表
#
# 用途：G6（人物关系一致性检查）。判定「谁怎么叫谁」以及**称呼背后的语体**。
#
# 为什么单独成文件：
#   称呼是跨角色数据，维护节奏与「读音」「专有名词表记」不同；且体积增长快，
#   塞进 characters/ 的单个角色文件会让其余部分难以阅读。
#   角色文件只写「如何用」的口径，具体表在此。**此处是称呼数据的唯一事实来源。**
#
# ★ 「空」的含义（用户已确认）
#   forms: [] 表示「**那两人一次也没有见过面**」。
#   不是「未调查」。出典的称呼一览中记为「-」的组合，
#   表示作品中不存在对话・接触的记录。
#   → 未调查的组合**不追加**到本表（G8）。
#   → 没有见过面的对象，不写进双方的映射表（不要写成非对称）。
#
# ★ 称呼按出典原样以**代号**记录（レイヤ / ロック / マスキング / パレオ）。
#   canonical 是本名（和奏レイヤ 等），因此通过 proper-nouns.yaml 的 aliases 解析。
#
# ── 字段 ───────────────────────────────────────────────────
# forms[]     该称呼的所有形式
#   form      称呼形态
#   stage     使用阶段（progression: true 时必填）
#   register  伴随的语体：常体 / 丁寧体 / 可変
# progression true  = 多个 form 是**关系推进的时间序列**（阶段用错就是错）
#             false = 多个 form 是**同时可用的变体**（择一即可）
# never_met   true  = 该二人从未见过（出典「-」）。此时 forms 为空
# confirmed   true  = 表记与称呼较可靠 / false = 来自中文译名转换，待核对
#
