# 称呼对应表
# 
# 用途：G6（人物关系一致性检查）。判定「谁怎么叫谁」以及**称呼背后的语体**。
# 
# 为什么单独成文件：
#   称呼是跨角色数据，与「读音」「专有名词」的维护节奏不同；而且本表体积增长快，
#   塞进 characters/*.md 会让角色文件的其余部分难以阅读。
#   角色文件只写「如何用」的口径，具体表在此。**此处是称呼数据的唯一事实来源。**
# 
# ★ 「空」の意味（ユーザー確認済み）──────────────────────────
#   forms: [] は「**その二人は一度も会っていない**」を意味する。
#   「未調査」ではない。出典の称呼一覧で「-」と記録された組み合わせは、
#   作中に会話・接触の記録がないことを示す。
#   → 未調査の組み合わせは本表に**追加しない**（G8）。
#   → 会っていない相手は、双方のマップに載せない（非対称に書かない）。
# 
# ── 字段 ───────────────────────────────────────────────────
# forms[]     该称呼的所有形式
#   form      称呼形态
#   stage     使用阶段（progression: true 时必填）
#   register  伴随的语体：常体 / 丁寧体 / 可変
# progression true  = 多个 form 是**关系推进的时间序列**（阶段用错就是错）
#             false = 多个 form 是**同时可用的变体**（择一即可）
# never_met   true  = 该二人从未见过（出典「-」）。此时 forms 为空
# confirmed   true  = 表记与称呼较可靠 / false = 来自中文译名转换，待核对
# 
source:
  work: 萌娘百科「高松灯」ほか MyGO!!!!! メンバー各項目
  revisions:
    高松燈: 8649612
    千早愛音: 8638705
    要楽奈: 8611091
    椎名立希: 8626221
    長崎そよ: 8649573
  retrieved: 2026-02-14
  license: CC BY-NC-SA 3.0 CN
  attribution: |
    称呼データは萌娘百科の各記事から抽出・翻訳したもの。
    同サイトは CC BY-NC-SA 3.0 CN で提供されている。
    本リポジトリを**非商業目的**で利用する場合のみ、この帰属表示を保持すること。
  note: |
    ★ 称呼データは**二次情報**である。confirmed: false の項目は、
      本文で使う前に公式設定・公式台詞で裏取りすること（G8）。

version: 2
updated: 2026-08-31

