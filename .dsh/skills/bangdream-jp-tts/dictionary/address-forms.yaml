# 称呼对应表
#
# 用途：G6（人物关系一致性检查）。判定「谁怎么叫谁」以及**称呼背后的语体**。
#
# 为什么单独成文件：
#   称呼是跨角色数据，与「读音」「专有名词」的维护节奏不同；而且本表体积增长快
#   （灯一人就有 40+ 条），塞进 characters/*.md 会让角色文件的其余部分难以阅读。
#   角色文件只写「如何用」的口径，具体表在此。**此处是称呼数据的唯一事实来源。**
#
# ── 来源 ─────────────────────────────────────────────────────
source:
  work: 萌娘百科「高松灯」
  revision: 8649612
  last_edited: 2026-08-31
  language: 中文（角色名为译名，本项目已转为日文表记）
  retrieved: 2026-02-14
  url: https://zh.moegirl.org.cn/index.php?title=高松灯&oldid=8649612
  license: CC BY-NC-SA 3.0 CN
  attribution: |
    称呼データは萌娘百科の記事（上記 revision）から抽出・翻訳したもの。
    同サイトは CC BY-NC-SA 3.0 CN で提供されている。
    本リポジトリを**非商業目的**で利用する場合のみ、この帰属表示を保持すること。
    商業利用する場合は同ライセンス条項に従い、別途許諾が必要。
  note: |
    ★ 称呼データは**二次情報**である。公式設定・公式台詞による裏取りが望ましい。
      `confirmed: false` の項目は特に、本文で使う前に公式確認を行うこと（G8）。
#
# ── 字段 ─────────────────────────────────────────────────────
# forms[]        该称呼的所有形式
#   form         称呼形态
#   stage        使用阶段（progression 时必填）
#   register     伴随的语体：常体 / 丁寧体 / 可変
#   note         补充说明
# progression    true  = 多个 form 是**关系推进的时间序列**（→ 連接）
#                false = 多个 form 是**同时可用的变体**（择一，不涉时间）
# confirmed      该行是否已用官方来源核对
#   true         日文表记与称呼均较可靠
#   false        来自中文译名转换，或读音/表记待核对
#
# ── 时间轴（重要）─────────────────────────────────────────────
# `progression: true` 时，多个 form 表示**关系发展的序列**，
# 不是同时可用的同义变体。这是 G6「关系变化要跟随」的正面应用：
#   stage: 初期   → 关系尚未建立
#   stage: 中期   → 关系建立后
#   stage: 后期   → 亲昵 / 稳定后
# **同一场景内不得混用不同 stage 的称呼。**
#
# `progression: false`（既定）時は複数 form が同時に成立する。
#   例：香澄の「有咲」「ありさ」はどちらも同じ時期に使える。
#   この場合 stage は不要。
#
# ── 未登记处理 ───────────────────────────────────────────────
# 表中为 `forms: []`（空）表示**出典明确记载为「-」（无称呼）**，
# 即该角色不直接称呼灯，或原作未给出称呼。
# 这与「未调查」不同：未调查的组合**不要猜**（G8），不要写进本表。

version: 1
updated: 2026-08-31

