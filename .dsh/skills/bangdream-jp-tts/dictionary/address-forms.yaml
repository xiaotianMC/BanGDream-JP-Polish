# 戸山香澄（とやま かすみ / ポッピンパーティ）
# ═════════════════════════════════════════════════════════════
戸山香澄:

  self:
    first_person: わたし

  addresses:
    市ヶ谷有咲: { progression: false, forms: [{ form: 有咲, register: 常体 }, { form: ありさ, register: 常体 }], confirmed: true }
    花園たえ: { progression: false, forms: [{ form: たえ, register: 常体 }, { form: たえちゃん, register: 常体 }], confirmed: true }
    牛込りみ: { progression: true, forms: [{ form: りみ, stage: 通年, register: 常体 }, { form: りみりん, stage: 后期, register: 常体 }], confirmed: true }
    山吹沙綾: { progression: true, forms: [{ form: 沙綾, stage: 通年, register: 常体 }, { form: さーや, stage: 后期, register: 常体 }], confirmed: true }
    湊友希那: { progression: false, forms: [{ form: 友希那さん, register: 丁寧体 }, { form: 友希那先輩, register: 丁寧体 }], confirmed: true }
    高松燈: { progression: false, forms: [{ form: 燈ちゃん, register: 常体 }], confirmed: true }
    目上: { progression: false, forms: [{ form: 姓 + さん, register: 丁寧体 }, { form: 姓 + 先生, register: 丁寧体 }], confirmed: true }
    初対面: { progression: false, forms: [{ form: 姓 + さん, register: 丁寧体 }], confirmed: true }
  note: |
    「りみりん」「さーや」は**親密な愛称**。関係構築後でのみ使用（stage: 后期）。
    初対面の場面では使わない。
    「有咲」「ありさ」は同時に使える変種（progression: false）。
    香澄は**場面**で敬体を切り替える（正式な場では丁寧体）。
    燈は**関係**で切り替える——両者を混同しない

