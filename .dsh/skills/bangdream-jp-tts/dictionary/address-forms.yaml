    仅在本仓库用于**非商业目的**时，才需要保留此署名。
  note: |-
    ★ 称呼数据是**二次信息**。confirmed: false 的条目，
      在正文使用前必须用官方设定・官方台词核对（G8）。

          RAS 的称呼数据从 5 个条目中抽取。**佐藤益木 的条目中没有称呼一览**，因此
          从其他成员一侧重构（masking.md 中有明记）。
          Roselia 的称呼从 5 个条目中抽取。**友希那・リサ・あこ 的条目中没有称呼节**，因此
          addresses 是从各对方一侧的记录重构的（各仅 4 条）。
          Ave Mujica 的称呼在 5 个条目中都有称呼一览（高质量）。
          祥子 拥有 3 组时间轴，にゃむ 用片假名的 `〜コ` 系爱称称呼所有人。
          ★ 純田真奈（スミミ）的条目中**没有称呼一览，语言描写本身也很匮乏**。
          subjects 中已登记，但 addresses / addressed_by 保持为空（不用推测填补）。
