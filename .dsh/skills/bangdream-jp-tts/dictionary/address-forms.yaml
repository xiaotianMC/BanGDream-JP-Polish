高松燈:

  self:
    first_person: 私
    note: 一人称は「私」。他の一人称を使わない

  # ── 灯 → 对方 ──────────────────────────────────────────────
  # 规则：先輩・他バンドの知人には「姓 + さん」＋丁寧体。
  #       マイゴのメンバーと旧CRYCHICの相手には「名 + ちゃん」＋常体。
  #       この分布は非常に整っており、整合性検査の強い信号になる。
  addresses:

    戸山香澄:
      forms:
        - form: 香澄さん
          stage: 通年
          register: 丁寧体
      confirmed: true

    花園たえ:
      forms: []
      confirmed: true

    牛込りみ:
      forms: []
      confirmed: true

    山吹沙綾:
      forms:
        - form: 沙綾さん
          stage: 通年
          register: 丁寧体
      confirmed: true

    市ヶ谷有咲:
      forms: []
      confirmed: true

    美竹蘭:
      forms:
        - form: 美竹さん
          stage: 通年
          register: 丁寧体
      confirmed: true

    羽沢つぐみ:
      forms:
        - form: 羽沢さん
          stage: 通年
          register: 丁寧体
      confirmed: true

    氷川日菜:
      forms:
        - form: 氷川さん
          stage: 通年
          register: 丁寧体
      confirmed: true
      note: 天文部を引き継いだ元生徒会長。丁寧体が自然

    今井リサ:
      forms:
        - form: 今井さん
          stage: 通年
          register: 丁寧体
      confirmed: true

    千早愛音:
      progression: true
      forms:
        - form: 千早さん
          stage: 初期
          register: 可変
          note: 出会った直後
        - form: 愛音ちゃん
          stage: 中期
          register: 常体
          note: バンド結成後
        - form: あのちゃん
          stage: 后期
          register: 常体
          note: 親密になった後
      confirmed: true
      note: |
        ★ 三形態は**時間軸**。同一場面で混用しない。
        初期の場面で「あのちゃん」を使わない

    要楽奈:
      forms:
        - form: 楽奈ちゃん
          stage: 通年
          register: 常体
      confirmed: true
      note: 楽奈は灯を「ともり」と呼び捨てにする。非対称だが原作通り

    長崎そよ:
      forms:
