unregistered:
  - item: アフターグロウ／ハロー、ハッピーワールド！／ロゼリア／ Pastel*Palettes／モルフォニカ／レイズアスイレン 内的称呼
    action: 确认各条目的称呼一览后追加（PPP・マイゴ以外未调查）
  - item: Ave Mujica 成员之间的称呼
    action: 未调查。代号表记的处理方式也未确定
  - item: スミミ内的称呼（純田真奈 ⇄ 三角初華）
    action: |
      出典的两个条目中都没有称呼一览。能够确认的只有
      「在スミミ中互相不加姓」这一组合共通的约定。
      私人场面中的称呼方式（`初華ちゃん` 还是 `初華`）未调查
  - item: 月島麻里奈 → 其他角色的称呼
    action: |
      出典的称呼表只有「主要角色 → 麻里奈」**这一个方向**。
      麻里奈自己怎么称呼对方，出典中没有。
      能从语音确认的只有**对玩家（后辈）使用的 `君`**
  - item: 音乐业界相关者（都筑詩船 / 真次凛々子 / 能々美子）
    action: |
      出典中没有称呼表，或者条目本身不存在。
      ・都筑詩船：无称呼表。对楽奈（外孙女）的称呼方式也未确认
      ・真次凛々子：无称呼表。对后辈员工的称呼方式也未确认
      ・能々美子：**没有独立条目**，因此无法获取称呼数据
      → 台词中需要称呼时，提交到【待确认】
  - item: 新規バンド 3 組（梦限大MewType / millsage / 一家Dumb Rock!）内的称呼
    action: 未调查
  - item: クライシック期的称呼・语体
    action: |
      当前的称呼表记录的是「现在的关系」。クライシック期是另一份数据。
      因为祥子退出前后语体可能发生变化，
      需要另行从出典中抽取（见 characters/crychic/_band.md）
